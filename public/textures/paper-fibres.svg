<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640">
  <!-- Long paper fibres running mostly with the grain, a few across it. -->
  <filter id="along" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".014 .38" numOctaves="3" seed="5" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .37  0 0 0 0 .18  1.5 0 0 0 -.88"/>
  </filter>
  <filter id="across" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".38 .02" numOctaves="2" seed="13" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .22  1.2 0 0 0 -.76"/>
  </filter>
  <filter id="age" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".006" numOctaves="4" seed="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .78  0 0 0 0 .56  0 0 0 0 .2  .9 0 0 0 -.42"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#age)"/>
  <rect width="100%" height="100%" filter="url(#along)"/>
  <rect width="100%" height="100%" filter="url(#across)"/>
</svg>
